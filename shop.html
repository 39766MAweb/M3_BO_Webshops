<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="shop.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@100..900&family=Vollkorn:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>

<header class="homepage-header">
    <h1 class="homepage-title">Raul's Potion Shop</h1>

    <nav class="homepage-bar">
        <a href="index.html"><button class="homepage-button">Home</button></a>
        <button class="homepage-button">Shop</button>
        <button class="homepage-button">Cart</button>
        <button class="homepage-button">FAQ</button>
    </nav>
</header>

<main class="shop-layout">

    <aside class="filter-bar">
        <h2>Filter by Rarity</h2>

        <label><input type="checkbox" value="exotic"> Exotic</label>
        <label><input type="checkbox" value="rare"> Rare</label>
        <label><input type="checkbox" value="uncommon"> Uncommon</label>
        <label><input type="checkbox" value="common"> Common</label>
    </aside>

    <section class="products" id="product-list">

        <article class="product" data-rarity="rare">
            <img class="product-img" src="https://static.wikia.nocookie.net/roblox-arcane-odyssey/images/a/a8/Stormsalt.png/revision/latest?cb=20231029230214">
            <h3 class="product-price">Stormsalt</h3>
            <div class="product-price">12,500 Drachma</div>
            <button class="product-button">Buy now</button>
        </article>

        <article class="product" data-rarity="rare">
            <img class="product-img" src="https://static.wikia.nocookie.net/roblox-arcane-odyssey/images/9/9e/Auric_Seaweed.png/revision/latest?cb=20231029224210">
            <h3 class="product-price">Auric Seaweed</h3>
            <div class="product-price">2,500 Drachma</div>
            <button class="product-button">Buy now</button>
        </article>

        <article class="product" data-rarity="rare">
            <img class="product-img" src="https://static.wikia.nocookie.net/roblox-arcane-odyssey/images/5/50/Poisonous_Tooth.png/revision/latest?cb=20231029225748">
            <h3 class="product-price">Poisonous Tooth</h3>
            <div class="product-price">25,000 Drachma</div>
            <button class="product-button">Buy now</button>
        </article>

        <article class="product" data-rarity="rare">
            <img class="product-img" src="https://static.wikia.nocookie.net/roblox-arcane-odyssey/images/8/8f/Thornflower.png/revision/latest?cb=20231029224651">
            <h3 class="product-price">Thornflower</h3>
            <div class="product-price">5,000 Drachma</div>
            <button class="product-button">Buy now</button>
        </article>

        <article class="product" data-rarity="rare">
            <img class="product-img" src="https://static.wikia.nocookie.net/roblox-arcane-odyssey/images/0/0d/Prismatic_Geode.png/revision/latest?cb=20231029223907">
            <h3 class="product-price">Prismatic Geode</h3>
            <div class="product-price">5,500 Drachma</div>
            <button class="product-button">Buy now</button>
        </article>

        <article class="product" data-rarity="exotic">
            <img class="product-img" src="https://static.wikia.nocookie.net/roblox-arcane-odyssey/images/b/b0/Aeroplast.png/revision/latest?cb=20231029223539">
            <h3 class="product-price">Aeroplast</h3>
            <div class="product-price">20,500 Drachma</div>
            <button class="product-button">Buy now</button>
        </article>

        <article class="product" data-rarity="exotic">
            <img class="product-img" src="https://static.wikia.nocookie.net/roblox-arcane-odyssey/images/c/c9/Arctic_Crystal.png/revision/latest?cb=20231029223700">
            <h3 class="product-price">Artic Crystal</h3>
            <div class="product-price">18,000 Drachma</div>
            <button class="product-button">Buy now</button>
        </article>

        <article class="product" data-rarity="exotic">
            <img class="product-img" src="https://static.wikia.nocookie.net/roblox-arcane-odyssey/images/3/3b/Clearstone.png/revision/latest?cb=20231030011604">
            <h3 class="product-price">Clearstone</h3>
            <div class="product-price">19,500 Drachma</div>
            <button class="product-button">Buy now</button>
        </article>

        <article class="product" data-rarity="exotic">
            <img class="product-img" src="https://static.wikia.nocookie.net/roblox-arcane-odyssey/images/4/43/Cloudroot.png/revision/latest?cb=20231029230434">
            <h3 class="product-price">Cloudroot</h3>
            <div class="product-price">17,000 Drachma</div>
            <button class="product-button">Buy now</button>
        </article>



    </section>

</main>

</body>
</html>
